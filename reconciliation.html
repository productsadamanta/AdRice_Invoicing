<!DOCTYPE html>
<html lang="pl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rekoncyliacja Wartości Leadów - AdRice Invoicing</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <!-- PapaParse do parsowania CSV -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --panel-bg: #1e293b;
            --accent: #10b981;
            --accent-hover: #34d399;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: rgba(255, 255, 255, 0.1);
            --warn: #f59e0b;
            --danger: #ef4444;
            --info: #60a5fa;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 2rem;
            min-height: 100vh;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            border-bottom: 1px solid var(--border);
            padding-bottom: 1.5rem;
            flex-wrap: wrap;
            gap: 1rem;
        }

        h1 { margin: 0; font-size: 1.8rem; background: -webkit-linear-gradient(45deg, #10b981, #60a5fa); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
        h2 { font-size: 1.1rem; color: var(--text-main); margin: 0 0 1rem 0; display:flex; align-items:center; gap:0.5rem; }
        h3 { font-size: 0.95rem; color: var(--accent-hover); margin: 1.5rem 0 0.75rem 0; }

        .month-selector select, .header select {
            padding: 0.6rem 1rem;
            background: var(--panel-bg);
            border: 1px solid var(--accent);
            border-radius: 8px;
            color: white;
            font-weight: 600;
            cursor: pointer;
        }


        .panel {
            background: var(--panel-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
        }

        .upload-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 1rem;
            margin-bottom: 1rem;
        }

        .dropzone {
            border: 2px dashed var(--border);
            border-radius: 10px;
            padding: 1.25rem;
            text-align: center;
            background: rgba(0,0,0,0.15);
            transition: all 0.2s;
        }
        .dropzone.filled { border-color: var(--accent); background: rgba(16,185,129,0.06); }
        .dropzone label { display:block; font-size:0.8rem; font-weight:600; margin-bottom:0.5rem; color: var(--text-main); }
        .dropzone input[type=file] { width:100%; font-size:0.75rem; color: var(--text-muted); }
        .dropzone .filestat { font-size: 0.7rem; color: var(--accent-hover); margin-top:0.4rem; min-height: 1em; }

        .btn {
            padding: 0.65rem 1.2rem;
            border-radius: 8px;
            border: 1px solid var(--accent);
            background: rgba(16,185,129,0.15);
            color: var(--accent-hover);
            font-weight: 700;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.2s;
        }
        .btn:hover { background: rgba(16,185,129,0.3); }
        .btn.secondary { border-color: var(--info); background: rgba(59,130,246,0.1); color: var(--info); }
        .btn.secondary:hover { background: rgba(59,130,246,0.25); }
        .btn.ghost { border-color: var(--border); background: rgba(255,255,255,0.04); color: var(--text-muted); }
        .btn.big { padding: 1rem 2rem; font-size: 1rem; }
        .btn:disabled { opacity: 0.4; cursor: not-allowed; }


        table.data-table {
            width: 100%;
            border-collapse: collapse;
            background: rgba(0,0,0,0.15);
            border-radius: 10px;
            overflow: hidden;
            font-size: 0.82rem;
        }
        table.data-table th, table.data-table td { padding: 0.7rem 0.9rem; text-align: left; border-bottom: 1px solid var(--border); }
        table.data-table th { background: rgba(255, 255, 255, 0.03); color: var(--text-muted); font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.04em; }
        table.data-table tbody tr:hover { background: rgba(255,255,255,0.03); cursor: pointer; }

        .tag { font-size: 0.65rem; font-weight: 700; padding: 2px 6px; border-radius: 4px; display:inline-block; }
        .tag-ok { background: rgba(16,185,129,0.15); color: #34d399; }
        .tag-warn { background: rgba(245,158,11,0.15); color: #fbbf24; }
        .tag-danger { background: rgba(239,68,68,0.15); color: #f87171; }
        .tag-info { background: rgba(96,165,250,0.15); color: #93c5fd; }
        .tag-muted { background: rgba(148,163,184,0.15); color: #94a3b8; }

        .stat-row { display:flex; gap:2rem; flex-wrap:wrap; margin-bottom:1rem; }
        .stat-box { }
        .stat-box .stat-label { font-size:0.7rem; color:var(--text-muted); text-transform:uppercase; letter-spacing:0.04em; }
        .stat-box .stat-value { font-size:1.4rem; font-weight:700; }

        .empty-state {
            padding: 2.5rem;
            text-align: center;
            color: var(--text-muted);
            background: rgba(0,0,0,0.1);
            border-radius: 10px;
            border: 2px dashed var(--border);
            font-size: 0.85rem;
        }

        .confidence-banner {
            background: rgba(245,158,11,0.08);
            border: 1px solid rgba(245,158,11,0.35);
            border-radius: 10px;
            padding: 1rem 1.25rem;
            margin-bottom: 1.25rem;
            font-size: 0.8rem;
            color: #fcd34d;
            line-height:1.6;
        }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(8px);
            z-index: 3000;
            align-items: center;
            justify-content: center;
        }
        .modal-body {
            background: var(--panel-bg);
            width: 92%;
            max-width: 950px;
            max-height: 85vh;
            border-radius: 16px;
            border: 1px solid var(--border);
            padding: 2rem;
            overflow-y: auto;
            position: relative;
            box-shadow: 0 25px 50px rgba(0,0,0,0.6);
        }
        .close-modal { position: absolute; top: 1.5rem; right: 1.5rem; cursor: pointer; font-size: 1.5rem; color: var(--text-muted); }
        .close-modal:hover { color: white; }

        #notification {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            background: #10b981;
            padding: 1rem 1.5rem;
            border-radius: 8px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
            display: none;
            z-index: 2000;
            max-width: 420px;
            font-size: 0.85rem;
        }

    </style>
</head>

<body>

    <div class="header">
        <h1>🔍 Rekoncyliacja Wartości Leadów</h1>
        <div style="display:flex; gap:0.75rem; align-items:center; flex-wrap:wrap;">
            <div class="month-selector">
                <select id="activeMonth" onchange="onMonthChange()"></select>
            </div>
        </div>
    </div>

    <!-- SEKCJA A -->
    <div class="panel">
        <h2>💶 Sekcja A — Daty granic zmian cen</h2>

        <div class="upload-grid">
            <div class="dropzone" id="dz-history">
                <label>📄 Dokładna historia cen (wynik adrice_offer_history_scraper.js)</label>
                <input type="file" id="fileHistory" accept=".csv" multiple onchange="onHistoryFilesSelected(this.files)">
                <div class="filestat" id="stat-history"></div>
                <button class="btn secondary" style="margin-top:0.6rem; width:100%;" onclick="copyOfferHistoryScraper()">📋 Kopiuj skrypt scrapera historii cen</button>
            </div>
        </div>

        <div id="priceHistoryCoverage"></div>
    </div>

    <!-- SEKCJA B -->
    <div class="panel">
        <h2>📅 Sekcja B — Leady z realną datą powstania</h2>

        <div class="upload-grid">
            <div class="dropzone" id="dz-uncapped">
                <label>Uncapped (PL/HU)</label>
                <input type="file" id="fileAdminUncapped" accept=".csv" onchange="onAdminFileSelected(this.files[0], 'Uncapped', 'dz-uncapped', 'stat-uncapped')">
                <div class="filestat" id="stat-uncapped"></div>
            </div>
            <div class="dropzone" id="dz-find">
                <label>Find (DE/LT/CZ/SK/LV)</label>
                <input type="file" id="fileAdminFind" accept=".csv" onchange="onAdminFileSelected(this.files[0], 'Find', 'dz-find', 'stat-find')">
                <div class="filestat" id="stat-find"></div>
            </div>
            <div class="dropzone" id="dz-alcance">
                <label>Alcance (PT/ES)</label>
                <input type="file" id="fileAdminAlcance" accept=".csv" onchange="onAdminFileSelected(this.files[0], 'Alcance', 'dz-alcance', 'stat-alcance')">
                <div class="filestat" id="stat-alcance"></div>
            </div>
        </div>

        <div style="margin-bottom:1rem;">
            <button class="btn ghost" onclick="clearLeadsData()">🗑️ Wyczyść wczytane leady</button>
        </div>

        <div id="leadsSummary"></div>
    </div>

    <!-- SEKCJA C -->
    <div class="panel">
        <h2>📊 Sekcja C — Raport rozbieżności</h2>

        <h3 style="margin-top:0;">⚡ Oferty ze zmianą ceny w wybranym miesiącu</h3>
        <div id="priceChangesThisMonth"></div>

        <div style="margin:1.5rem 0 1.25rem; display:flex; gap:1rem; align-items:center; flex-wrap:wrap;">
            <button class="btn big" onclick="runReconciliation()">⚙️ Oblicz Rozbieżności dla wybranego miesiąca</button>
            <button class="btn ghost" id="exportReportBtn" style="display:none;" onclick="exportReportCsv()">⬇️ Eksportuj raport (CSV)</button>
        </div>
        <div id="reportContainer"></div>
    </div>

    <!-- Modal -->
    <div id="detailsModal" class="modal-overlay">
        <div class="modal-body">
            <span class="close-modal" onclick="closeModal()">&times;</span>
            <div id="modalContent"></div>
        </div>
    </div>

    <div id="notification"></div>

<script>
// ============================================================================
// STAN / STAŁE
// ============================================================================
const LS_INVOICING = 'adrice_invoicing_db_v2';
const LS_PRICE_HISTORY = 'adrice_price_history_v1';
// Staging dla ręcznych korekt z rekoncyliacji (patrz sekcja 0 dopisku w RECONCILIATION_SESSION_LOG.md,
// przypadek #2285) — CELOWO osobny klucz od `adrice_pending_adjustments` używanego przez index.html.
// reconciliation.html tylko tu ZAPISUJE zgłoszenia (status 'pending_import'); nigdy nie dotyka
// bezpośrednio prawdziwego salda Hub-a. Dopiero index.html, po ręcznym zatwierdzeniu przez
// użytkownika, kopiuje zatwierdzony wpis do adrice_pending_adjustments i oznacza go tu jako 'imported'.
const LS_RECONCILIATION_ADJUSTMENTS = 'adrice_reconciliation_adjustments';
const SCOPE_COUNTRIES = ['pl','hu','de','lt','cz','sk','lv','pt','es'];
const COUNTRY_NAMES = { pl:'Poland', hu:'Hungary', de:'Germany', lt:'Lithuania', cz:'Czechia', sk:'Slovakia', lv:'Latvia', pt:'Portugal', es:'Spain' };

let invoicingDB = JSON.parse(localStorage.getItem(LS_INVOICING)) || {};
let historicalDB = {}; // opcjonalny import z ArchiveBackups, uzupełniający brakujące miesiące
let priceHistory = loadPriceHistory();
let leadsData = [];       // {offerId, country, account, creationDate: Date, status, shipStatus, source}
let leadsImportStats = {};
let lastReportRows = [];
let lastReportMonth = null;

function loadPriceHistory() {
    try {
        const raw = JSON.parse(localStorage.getItem(LS_PRICE_HISTORY));
        if (raw && raw.offers) return raw;
    } catch (e) {}
    return { schemaVersion: 1, offers: {}, lastScrapeAt: null };
}
function savePriceHistory() {
    localStorage.setItem(LS_PRICE_HISTORY, JSON.stringify(priceHistory));
}

// ============================================================================
// POMOCNICZE
// ============================================================================
function parseCSVFile(file, options = {}) {
    return new Promise((resolve, reject) => {
        Papa.parse(file, { header: true, skipEmptyLines: true, ...options, complete: r => resolve(r.data), error: reject });
    });
}
function parseEuroDecimal(v) {
    if (v === null || v === undefined || v === '') return 0;
    const n = parseFloat(String(v).replace(',', '.'));
    return isNaN(n) ? 0 : n;
}
function parseAdministrationDate(v) {
    if (!v) return null;
    const m = String(v).match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})\s+(\d{1,2}):(\d{2}):(\d{2})/);
    if (!m) return null;
    return new Date(+m[3], +m[2] - 1, +m[1], +m[4], +m[5], +m[6]);
}
function parseLogTimestamp(ts) {
    if (!ts) return null;
    const m = String(ts).match(/(\d{1,2})\.(\d{1,2})\.(\d{4}),?\s+(\d{1,2}):(\d{2}):(\d{2})/);
    if (!m) return null;
    return new Date(+m[3], +m[2] - 1, +m[1], +m[4], +m[5], +m[6]);
}
function startOfDay(d) { return new Date(d.getFullYear(), d.getMonth(), d.getDate(), 0, 0, 0, 0); }
function endOfDay(d) { return new Date(d.getFullYear(), d.getMonth(), d.getDate(), 23, 59, 59, 999); }
function addDays(d, n) { const r = new Date(d); r.setDate(r.getDate() + n); return r; }
function shiftMonthKey(monthKey, delta) {
    let [y, m] = monthKey.split('-').map(Number);
    m += delta;
    while (m > 12) { m -= 12; y++; }
    while (m < 1) { m += 12; y--; }
    return `${y}-${String(m).padStart(2, '0')}`;
}
function monthBounds(monthKey) {
    const [y, m] = monthKey.split('-').map(Number);
    return { start: new Date(y, m - 1, 1), end: endOfDay(new Date(y, m, 0)) };
}
function fmtDate(d) {
    if (!d) return '?';
    return `${String(d.getDate()).padStart(2,'0')}.${String(d.getMonth()+1).padStart(2,'0')}.${d.getFullYear()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}
function showNotif(msg, duration = 3500) {
    const n = document.getElementById('notification');
    n.innerText = msg;
    n.style.display = 'block';
    setTimeout(() => n.style.display = 'none', duration);
}
function closeModal() { document.getElementById('detailsModal').style.display = 'none'; }
function downloadFile(filename, content, mime) {
    const blob = new Blob([content], { type: mime });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
}

function initMonthSelector() {
    const select = document.getElementById('activeMonth');
    const now = new Date();
    const currentVal = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
    const endYear = now.getFullYear() + 1, endMonth = 11, startYear = 2026, startMonth = 2;
    for (let year = endYear; year >= startYear; year--) {
        let mEnd = (year === endYear) ? endMonth : 11;
        let mStart = (year === startYear) ? startMonth : 0;
        for (let m = mEnd; m >= mStart; m--) {
            let val = `${year}-${String(m + 1).padStart(2, '0')}`;
            let label = new Date(year, m, 15).toLocaleString('pl-PL', { month: 'long', year: 'numeric' });
            let opt = document.createElement('option');
            opt.value = val; opt.innerText = label;
            if (val === currentVal) opt.selected = true;
            select.appendChild(opt);
        }
    }
}
function onMonthChange() {
    renderPriceChangesThisMonth();
    document.getElementById('reportContainer').innerHTML = '';
    document.getElementById('exportReportBtn').style.display = 'none';
}

// SEKCJA A — HISTORIA CEN
// ============================================================================

function copyOfferHistoryScraper() {
    try {
        const binary = atob(OFFER_HISTORY_SCRAPER_B64);
        const bytes = Uint8Array.from(binary, c => c.charCodeAt(0));
        const code = new TextDecoder('utf-8').decode(bytes);
        navigator.clipboard.writeText(code).then(() => {
            showNotif('📋 Skrypt scrapera historii cen skopiowany! Wklej w konsoli (F12) na stronie /en/offers w AdRice.', 5000);
        });
    } catch (e) {
        alert('Błąd dekodowania skryptu scrapera: ' + e.message);
    }
}

// ============================================================================
// OŚ CZASU CEN — WARTOŚCI zawsze z realnie zafakturowanych stawek (logi Hub-a),
// DATY granic zmian z historii AdRice / snapshotu (Sekcja A). Rekonstrukcja WARTOŚCI
// z sumowania komponentów oferty (Payout+Advertiser Fee+Native Adv Fee) została
// porzucona jako z natury krucha — udowodnione na #3234, gdzie scraper przegapił
// jeden rodzaj zmiany i dawał błąd +1€ na każdym poziomie ceny mimo poprawnej daty
// granicy. Szczegóły decyzji: RECONCILIATION_SESSION_LOG.md, sekcja 4.
// ============================================================================

function getDateGranularity() {
    return 'exact'; // 'day' | 'exact'
}
// Faktury liczone są za całe zakończone dni — domyślnie porównujemy datę leada z datą zmiany
// ceny na poziomie DNIA (cały dzień zmiany = już nowa cena), niezależnie od godziny obu zdarzeń.
function truncateForGranularity(date) {
    return getDateGranularity() === 'day' ? startOfDay(date) : date;
}

// Wszystkie zafakturowane obserwacje ceny dla danej oferty, ze WSZYSTKICH znanych miesięcy,
// posortowane chronologicznie. Jedyne źródło WARTOŚCI cen w całym narzędziu.
function getInvoicedObservations(offerId) {
    const obs = [];
    getAllKnownMonthKeys().forEach(mk => {
        getMonthLogs(mk).forEach(log => {
            const ts = parseLogTimestamp(log.timestamp);
            if (!ts) return;
            (log.items || []).forEach(it => {
                if (it.id !== offerId) return;
                obs.push({ price: it.price, timestamp: ts, invoiceNumber: log.invoiceNumber, mode: log.mode, monthKey: mk, type: log.type });
            });
        });
    });
    obs.sort((a, b) => a.timestamp - b.timestamp);
    return obs;
}

// Zwija chronologiczne obserwacje w kolejne, RÓŻNE poziomy cenowe (pomija powtórzenia tej samej ceny).
function getInvoicedPriceSegments(offerId) {
    const obs = getInvoicedObservations(offerId);
    if (obs.length === 0) return [];
    const segments = [];
    let cur = { price: obs[0].price, firstObservedAt: obs[0].timestamp, lastObservedAt: obs[0].timestamp };
    for (let i = 1; i < obs.length; i++) {
        if (Math.abs(obs[i].price - cur.price) > 0.001) {
            segments.push(cur);
            cur = { price: obs[i].price, firstObservedAt: obs[i].timestamp, lastObservedAt: obs[i].timestamp };
        } else {
            cur.lastObservedAt = obs[i].timestamp;
        }
    }
    segments.push(cur);
    return segments;
}

// Kandydackie daty zmian z DOKŁADNEJ historii AdRice (Sekcja A, prawy dropzone) — używane
// WYŁĄCZNIE jako źródło daty granicy, nigdy wartości. Pomija BASELINE_SENTINEL_DATE (to punkt
// odniesienia dla pól bez zaobserwowanej historii, nie realna, potwierdzona zmiana).
function getHistoryChangeDates(offerId) {
    const offer = priceHistory.offers[offerId];
    if (!offer) return [];
    const componentFields = ['payout', 'cpa', 'advertiserFee', 'nativeAdvFee'];
    const dates = new Set();
    (offer.timeline || []).forEach(e => {
        if (!componentFields.includes(e.field)) return;
        if (e.changedAt === BASELINE_SENTINEL_DATE) return;
        dates.add(e.changedAt);
    });
    return [...dates].map(d => new Date(d)).sort((a, b) => a - b);
}
// Daty wykrycia zmiany przez cotygodniowy snapshot cen (Sekcja A, lewy dropzone) — to data
// uploadu, w którym zauważono inną cenę niż poprzednio, NIE data faktycznej zmiany. Gorsza
// pewność niż dokładna historia AdRice, ale lepsza niż czysty środek okna.
function getSnapshotChangeDates(offerId) {
    const offer = priceHistory.offers[offerId];
    if (!offer) return [];
    return (offer.timeline || [])
        .filter(e => e.field === 'totalPayout' && e.source === 'snapshot_diff')
        .map(e => new Date(e.changedAt))
        .sort((a, b) => a - b);
}
// Dla przejścia między dwoma sąsiednimi, realnie zaobserwowanymi poziomami cen, znajduje datę
// granicy w malejącej kolejności pewności: dokładna historia AdRice -> snapshot diff -> środek okna.
function findBoundaryDate(offerId, prevSegment, nextSegment) {
    const windowStart = prevSegment.lastObservedAt;
    const windowEnd = nextSegment.firstObservedAt;

    const historyDates = getHistoryChangeDates(offerId).filter(d => d > windowStart && d <= windowEnd);
    if (historyDates.length > 0) return { changedAt: historyDates[0], confidence: 'exact' };

    const snapshotDates = getSnapshotChangeDates(offerId).filter(d => d > windowStart && d <= windowEnd);
    if (snapshotDates.length > 0) return { changedAt: snapshotDates[0], confidence: 'inferred' };

    const mid = new Date((windowStart.getTime() + windowEnd.getTime()) / 2);
    return { changedAt: mid, confidence: 'approx' };
}

let _priceTimelineCache = {};
function invalidatePriceTimelineCache() { _priceTimelineCache = {}; }

// Pełna oś czasu cen dla oferty: WARTOŚCI z realnych faktur (getInvoicedPriceSegments),
// DATY granic z findBoundaryDate. Cache'owane per offerId w ramach jednej sesji strony —
// unieważniane przy każdej zmianie danych wejściowych (patrz invalidatePriceTimelineCache).
function getRealPriceTimeline(offerId) {
    if (_priceTimelineCache[offerId]) return _priceTimelineCache[offerId];
    const segments = getInvoicedPriceSegments(offerId);
    let timeline = [];
    if (segments.length > 0) {
        timeline.push({ changedAt: segments[0].firstObservedAt, value: segments[0].price, confidence: 'exact' });
        for (let i = 1; i < segments.length; i++) {
            const boundary = findBoundaryDate(offerId, segments[i - 1], segments[i]);
            timeline.push({ changedAt: boundary.changedAt, value: segments[i].price, confidence: boundary.confidence });
        }
    }
    _priceTimelineCache[offerId] = timeline;
    return timeline;
}

function getAllInvoicedOfferIds() {
    const ids = new Set();
    getAllKnownMonthKeys().forEach(mk => {
        getMonthLogs(mk).forEach(log => {
            (log.items || []).forEach(it => { if (it.id) ids.add(it.id); });
        });
    });
    return [...ids];
}

// Oferty, dla których realna cena w fakturach zmieniła się co najmniej raz, ale dla ŻADNEGO
// źródła w Sekcji A (ani dokładna historia AdRice, ani snapshot) nie znaleziono daty w oknie
// między obserwacjami — data granicy jest wtedy czystym przybliżeniem (środek okna).
function computeBoundaryGaps() {
    const gaps = [];
    getAllInvoicedOfferIds().forEach(offerId => {
        const segments = getInvoicedPriceSegments(offerId);
        for (let i = 1; i < segments.length; i++) {
            const boundary = findBoundaryDate(offerId, segments[i - 1], segments[i]);
            if (boundary.confidence === 'approx') {
                gaps.push({
                    offerId, oldPrice: segments[i - 1].price, newPrice: segments[i].price,
                    windowStart: segments[i - 1].lastObservedAt, windowEnd: segments[i].firstObservedAt,
                    usedDate: boundary.changedAt
                });
            }
        }
    });
    return gaps;
}

// Proste zestawienie: które oferty miały granicę zmiany ceny (w realnych fakturach) PADAJĄCĄ
// w obrębie wybranego miesiąca — niezależnie od tego, czy Sekcja B jest wgrana. Ma pomóc szybko
// wskazać, które oferty warto sprawdzić ręcznie (reszta miała stałą cenę przez cały miesiąc).
function computePriceChangesInMonth(targetMonth) {
    const { start, end } = monthBounds(targetMonth);
    const changes = [];
    getAllInvoicedOfferIds().forEach(offerId => {
        const tl = getRealPriceTimeline(offerId);
        for (let i = 1; i < tl.length; i++) {
            const at = tl[i].changedAt;
            if (at >= start && at <= end) {
                changes.push({ offerId, oldPrice: tl[i - 1].value, newPrice: tl[i].value, changedAt: at, confidence: tl[i].confidence });
            }
        }
    });
    changes.sort((a, b) => a.changedAt - b.changedAt);
    return changes;
}

// Diagnostyka: liczba zmian POLA payout w OFICJALNEJ historii AdRice (Sekcja A) w danym miesiącu —
// NIEZALEŻNA od liczby realnych przejść cenowych w fakturach. Rozjazd między tymi dwoma liczbami
// (np. #2285: 1 wg historii AdRice vs 2 wg faktur) to dokładnie sygnał, który złapał błąd na #2285 —
// pośredni poziom ceny w fakturach nie odpowiadał żadnej zalogowanej zmianie payoutu, więc
// prawdopodobnie był efektem chwilowej fluktuacji advertiser/native fee złapanej przez scraper.
function getPayoutOnlyHistoryDatesInMonth(offerId, monthKey) {
    const { start, end } = monthBounds(monthKey);
    const offer = priceHistory.offers[offerId];
    if (!offer) return [];
    return (offer.timeline || [])
        .filter(e => e.field === 'payout' && e.changedAt !== BASELINE_SENTINEL_DATE)
        .map(e => new Date(e.changedAt))
        .filter(d => d >= start && d <= end)
        .sort((a, b) => a - b);
}

// Ustala konto (kod kraju) dla oferty — preferuje mapę z realnych leadów Sekcji B (najpewniejsza),
// w jej braku spada do etykiety konta z ostatniego logu faktury (via resolveLogCountry, tak samo
// jak reszta narzędzia radzi sobie ze starymi etykietami find/alcance).
function resolveOfferAccount(offerId) {
    const fromLeads = buildOfferCountryMap()[offerId];
    if (fromLeads) return fromLeads;
    const obs = getInvoicedObservations(offerId);
    if (obs.length === 0) return null;
    return resolveLogCountry(obs[obs.length - 1].type, offerId, {});
}

// ============================================================================
// STAGING RĘCZNYCH KOREKT Z REKONCYLIACJI (patrz LS_RECONCILIATION_ADJUSTMENTS wyżej) —
// reconciliation.html tylko tu zapisuje, nigdy bezpośrednio do salda Hub-a.
// ============================================================================
function loadReconciliationAdjustments() {
    try {
        const raw = JSON.parse(localStorage.getItem(LS_RECONCILIATION_ADJUSTMENTS));
        if (Array.isArray(raw)) return raw;
    } catch (e) {}
    return [];
}
function saveReconciliationAdjustmentsList(list) {
    localStorage.setItem(LS_RECONCILIATION_ADJUSTMENTS, JSON.stringify(list));
}
function getReconciliationAdjustmentFor(offerId, country, month) {
    return loadReconciliationAdjustments().find(a => a.offerId === offerId && a.country === country && a.month === month) || null;
}
// Upsert: dopóki zgłoszenie nie zostało zatwierdzone w Hub-ie (status 'pending_import'), można je
// nadpisać poprawioną wartością zamiast tworzyć duplikat. Po 'imported' każde kolejne zgłoszenie
// dla tej samej oferty/miesiąca traktowane jest jako NOWA, osobna korekta.
function saveReconciliationAdjustment(offerId, country, month, amount, note) {
    const list = loadReconciliationAdjustments();
    const idx = list.findIndex(a => a.offerId === offerId && a.country === country && a.month === month && a.status === 'pending_import');
    if (idx >= 0) {
        list[idx].amount = amount;
        list[idx].note = note || '';
        list[idx].createdAt = new Date().toISOString();
    } else {
        list.push({ id: 'recon_' + Date.now(), offerId, country, month, amount, note: note || '', createdAt: new Date().toISOString(), status: 'pending_import' });
    }
    saveReconciliationAdjustmentsList(list);
}

function submitReconciliationAdjustment(offerId, country, month) {
    const amountEl = document.getElementById(`reconAmount-${offerId}`);
    const amount = parseFloat((amountEl.value || '').replace(',', '.'));
    if (isNaN(amount) || amount === 0) { alert('Podaj niezerową kwotę korekty (dodatnia = dopłata, ujemna = rabat).'); return; }
    if (!country) { alert('Nie udało się automatycznie ustalić konta (kraju) dla tej oferty — wgraj Sekcję B, żeby narzędzie znało przypisanie oferty do kraju.'); return; }
    if (!confirm(`Zgłosić korektę ${amount.toFixed(2)} € dla oferty #${offerId} (${country.toUpperCase()}), miesiąc ${month}?\n\nTrafi do panelu zatwierdzania w index.html — NIE zostanie od razu dopisana do salda, dopóki tam ręcznie nie klikniesz "Zatwierdź".`)) return;
    saveReconciliationAdjustment(offerId, country, month, amount, '');
    showNotif(`📝 Zgłoszono korektę rekoncyliacji dla #${offerId} — zatwierdź ją w index.html, żeby trafiła na kolejną fakturę.`);
    renderPriceChangesThisMonth();
}

function renderPriceChangesThisMonth() {
    const container = document.getElementById('priceChangesThisMonth');
    if (!container) return;
    const monthSelect = document.getElementById('activeMonth');
    if (!monthSelect || !monthSelect.value) return;
    const monthKey = monthSelect.value;
    const changes = computePriceChangesInMonth(monthKey);

    if (changes.length === 0) {
        container.innerHTML = `<div class="empty-state">Brak ofert ze zmianą ceny w ${monthKey}.</div>`;
        return;
    }

    const ids = [...new Set(changes.map(c => c.offerId))];
    let html = '<div style="display:flex; flex-direction:column; gap:0.6rem;">';

    ids.forEach(id => {
        const country = resolveOfferAccount(id);
        const invoicedChangeCount = changes.filter(c => c.offerId === id).length;
        const historyDates = getPayoutOnlyHistoryDatesInMonth(id, monthKey);
        const mismatch = historyDates.length !== invoicedChangeCount;
        const existing = country ? getReconciliationAdjustmentFor(id, country, monthKey) : null;

        let statusHtml, formHtml = '';
        if (existing && existing.status === 'imported') {
            statusHtml = `<span class="tag tag-ok">✅ zatwierdzone (${existing.amount > 0 ? '+' : ''}${existing.amount.toFixed(2)} €)</span>`;
        } else {
            statusHtml = existing ? `<span class="tag tag-info">⏳ zgłoszone (${existing.amount > 0 ? '+' : ''}${existing.amount.toFixed(2)} €)</span>` : '';
            formHtml = `<div style="display:flex; gap:0.5rem; flex-wrap:wrap; align-items:center; margin-top:0.4rem;">
                <input type="number" step="0.01" id="reconAmount-${id}" value="${existing ? existing.amount : ''}" placeholder="Kwota €" style="width:110px; padding:0.4rem; background:rgba(0,0,0,0.3); border:1px solid var(--border); border-radius:6px; color:var(--text-main);">
                <button class="btn secondary" style="padding:0.4rem 0.8rem;" onclick="submitReconciliationAdjustment('${id}', '${country || ''}', '${monthKey}')">💾 ${existing ? 'Zapisz poprawkę' : 'Zgłoś korektę'}</button>
            </div>`;
        }

        html += `<div class="panel" style="margin-bottom:0; padding:0.9rem 1.1rem;">
            <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:0.5rem;">
                <div>
                    <b>#${id}</b> — ${country ? country.toUpperCase() : '<span style="color:var(--text-muted)">nieznany kraj</span>'}
                    ${mismatch ? ' <span class="tag tag-danger" title="Liczba zmian payoutu w historii AdRice różni się od liczby przejść cenowych w fakturach — sprawdź ręcznie.">⚠️ niezgodność</span>' : ''}
                </div>
                ${statusHtml}
            </div>
            ${formHtml}
        </div>`;
    });
    html += '</div>';

    container.innerHTML = html;
}

function priceAt(offerId, date) {
    const tl = getRealPriceTimeline(offerId);
    if (tl.length === 0) return null;
    const cmpDate = truncateForGranularity(date);
    let applicable = null;
    for (const e of tl) {
        if (truncateForGranularity(e.changedAt) <= cmpDate) applicable = e; else break;
    }
    if (applicable) return { value: applicable.value, confidence: applicable.confidence, changedAt: applicable.changedAt.toISOString(), source: 'invoiced-price' };
    const earliest = tl[0];
    return { value: earliest.value, confidence: 'assumed', changedAt: earliest.changedAt.toISOString(), source: 'fallback-earliest-known' };
}

async function onHistoryFilesSelected(fileList) {

    }

function mergeExactHistoryRows(rows) {
    const scrapedAtGlobal = new Date().toISOString();
    let added = 0;
    rows.forEach(row => {
        const offerId = String(row['Offer_ID'] || '').trim();
        const field = String(row['Field'] || '').trim();
        const oldRaw = row['Old_Value'];
        const oldVal = (oldRaw === undefined || oldRaw === null || oldRaw === '') ? null : parseEuroDecimal(oldRaw);
        const newVal = parseEuroDecimal(row['New_Value']);
        const changedAt = row['Changed_At'];
        const scrapedAt = row['Scraped_At'] || scrapedAtGlobal;
        if (!offerId || !field || !changedAt) return;

        if (!priceHistory.offers[offerId]) priceHistory.offers[offerId] = { name: '', timeline: [] };
        const offer = priceHistory.offers[offerId];
        const dup = (offer.timeline || []).some(e => e.field === field && e.changedAt === changedAt && e.newValue === newVal);
        if (dup) return;

        offer.timeline.push({ field, oldValue: oldVal, newValue: newVal, changedAt, source: 'adrice_history_scrape', capturedAt: scrapedAt, confidence: 'exact' });
        added++;
    });
    invalidatePriceTimelineCache();
    savePriceHistory();
    return added;
}

function confidenceTag(c) {
    const map = {
        exact: ['tag-ok', 'exact'],
        inferred: ['tag-warn', 'inferred'],
        assumed: ['tag-danger', 'assumed'],
        approx: ['tag-danger', 'data granicy przybliżona'],
        'manual-review': ['tag-info', 'do ręcznego sprawdzenia'],
        'no-data': ['tag-danger', 'brak danych'],
        'not-invoiced': ['tag-muted', 'niezafakturowane'],
        'exact-cadence': ['tag-ok', 'cykl std.'],
        'off-cadence': ['tag-warn', 'poza cyklem'],
        'off-cadence-approx': ['tag-warn', 'poza cyklem (przybliż.)'],
        cumulative: ['tag-info', 'kumulacyjny (AUTOMAT)'],
        'cross-month-boundary': ['tag-danger', 'granica miesięcy'],
        'legacy-account-label': ['tag-warn', 'stara etykieta konta']
    };
    const [cls, label] = map[c] || ['tag-muted', c];
    return `<span class="tag ${cls}">${label}</span>`;
}

function getExcludedStatusSet() {
    return [];
}
function getExcludedShipStatusSet() {
    return ['Not Shipped'];
}
function getShipStatusExemptSet() {
    return ['OK - Pending'];
}
// Potwierdzony lead (Positivi): NIE ma statusu z listy wykluczeń, i NIE ma ship_status z listy
// wykluczeń — chyba że jego status jest na liście "zwolnionych" (np. OK - Pending naturalnie
// jeszcze nie mogło zostać wysłane, a mimo to się liczy). Reguła dostrajana empirycznie per
// ofertę przez panel sanity-check — jeśli kolejna oferta pokaże jeszcze inny wyjątek, dopisz go
// do odpowiedniej listy zamiast zmieniać kod.
function isConfirmedLead(lead) {
    if (getExcludedStatusSet().includes(lead.status)) return false;
    const exempt = getShipStatusExemptSet().includes(lead.status);
    if (!exempt && getExcludedShipStatusSet().includes(lead.shipStatus)) return false;
    return true;
}
function getPricingDateMode() {
    return 'creation'; // 'creation' | 'confirm'
}
// Zwraca {date, usedFallback} — data, wg której ustalamy cenę i przynależność do miesiąca dla danego leada.
function getPricingDate(lead) {
    if (getPricingDateMode() === 'confirm') {
        if (lead.confirmDate) return { date: lead.confirmDate, usedFallback: false };
        return { date: lead.creationDate, usedFallback: true };
    }
    return { date: lead.creationDate, usedFallback: false };
}
function getSourceFilterActive() {
    return true;
}

async function onAdminFileSelected(file, accountName, dzId, statId) {
    if (!file) return;

    statEl.innerText = 'Przetwarzanie...';
    const rows = await parseCSVFile(file, { delimiter: ';' });
    const sourceFilterActive = getSourceFilterActive();
    let matched = 0, skippedNoOffer = 0, skippedSource = 0, skippedCountry = 0, skippedNoDate = 0;

    // Usuwamy poprzednio wczytane leady z tego konta (żeby ponowny upload nadpisywał, nie dublował)
    leadsData = leadsData.filter(l => l.account !== accountName);

    rows.forEach(row => {
        const source = String(row['source'] || '').trim().toLowerCase();
        if (sourceFilterActive && !['traffic_manager', 'adrice'].includes(source)) { skippedSource++; return; }
        const sku = row['product_SKU'] || '';
        const m = sku.match(/UCP(\d+)/i);
        if (!m) { skippedNoOffer++; return; }
        const offerId = m[1];
        const countryRaw = String(row['country'] || '').trim().toUpperCase();
        if (!SCOPE_COUNTRIES.includes(countryRaw.toLowerCase())) { skippedCountry++; return; }
        const creationDate = parseAdministrationDate(row['creation_date']);
        if (!creationDate) { skippedNoDate++; return; }
        const confirmDate = parseAdministrationDate(row['confirm_date']);

        leadsData.push({
            offerId, country: countryRaw.toLowerCase(), account: accountName,
            creationDate, confirmDate, status: String(row['status'] || '').trim(),
            shipStatus: String(row['ship_status'] || '').trim(), source
        });

    leadsImportStats[accountName] = { rows: rows.length, matched, skippedNoOffer, skippedSource, skippedCountry, skippedNoDate };
    document.getElementById(dzId).classList.add('filled');

}

function getHistoricalMonth(monthKey) {
    return historicalDB[monthKey] || null;
}

// ============================================================================
// SEKCJA C — REKONCYLIACJA
// ============================================================================
function getMonthLogs(monthKey) {
    if (invoicingDB[monthKey] && invoicingDB[monthKey].logs && invoicingDB[monthKey].logs.length) return invoicingDB[monthKey].logs;
    const hist = getHistoricalMonth(monthKey);
    if (hist && hist.logs) return hist.logs;
    return [];
}

function getInferredRange(log, monthKey) {
    const confirmDate = parseLogTimestamp(log.timestamp);
    if (!confirmDate) return { start: null, end: null, confidence: 'unknown' };
    const dow = confirmDate.getDay(); // 0=Sun..6=Sat

    if (log.mode === 'KONTROLA (ZAKRES)') {
        if (dow === 1) { // poniedziałek -> Pt-Nd poprzedni
            const sun = addDays(startOfDay(confirmDate), -1);
            const fri = addDays(sun, -2);
            return { start: startOfDay(fri), end: endOfDay(sun), confidence: 'exact-cadence' };
        } else if (dow === 5) { // piątek -> Pn-Czw tego tygodnia
            const thu = addDays(startOfDay(confirmDate), -1);
            const mon = addDays(thu, -3);
            return { start: startOfDay(mon), end: endOfDay(thu), confidence: 'exact-cadence' };
        }
        return { start: null, end: null, confidence: 'off-cadence' };
    }
    // Tryby AUTOMAT / AUTOMAT (KOREKTA SALDA) — top-up kumulacyjny dla danego miesiąca
    const { start } = monthBounds(monthKey);
    return { start, end: endOfDay(confirmDate), confidence: 'cumulative' };
}

function getAllKnownMonthKeys() {
    const keys = new Set([...Object.keys(invoicingDB), ...Object.keys(historicalDB)]);
    return [...keys].filter(k => /^\d{4}-\d{2}$/.test(k));
}

// Przed migracją v3 (czerwiec 2026) logi były oznaczane nazwą KONTA (Find/Alcance obejmowały
// po kilka krajów naraz), a po migracji — kodem konkretnego kraju (DE/PT/...). Stare logi w
// bazie wciąż mają stare oznaczenia, więc ta sama oferta rozjeżdżała się na dwie osobne pozycje
// (np. "#4106 Alcance" i "#4106 PT"). Ustalamy prawdziwy kraj oferty na podstawie realnych danych
// z Sekcji B (Administration), a etykietę z logu traktujemy jako źródło prawdy TYLKO gdy jest już
// prawidłowym kodem kraju.
function buildOfferCountryMap() {
    const map = {};
    leadsData.forEach(l => { if (!map[l.offerId]) map[l.offerId] = l.country; });
    return map;
}
function resolveLogCountry(rawType, offerId, offerCountryMap) {
    const lower = (rawType || '').toLowerCase();
    if (SCOPE_COUNTRIES.includes(lower)) return lower;
    return offerCountryMap[offerId] || lower;
}

function computeActualForMonth(targetMonth) {
    const actual = {};
    const { start: monthStart, end: monthEnd } = monthBounds(targetMonth);
    const monthsToScan = [targetMonth, shiftMonthKey(targetMonth, -1), shiftMonthKey(targetMonth, 1)];
    const offerCountryMap = buildOfferCountryMap();

    monthsToScan.forEach(mk => {
        const logs = getMonthLogs(mk);
        logs.forEach(log => {
            let range = getInferredRange(log, mk);
            let includeWhole = false;

            if (mk === targetMonth) {
                // Log fizycznie leży we WŁASNEJ "szufladzie" miesiąca (invoicingDB[targetMonth].logs) —
                // to rozstrzyga przynależność, niezależnie od tego, czy jego wywnioskowany zakres dat
                // (na podstawie dnia tygodnia confirmDate) faktycznie pokrywa się z kalendarzowym
                // miesiącem. Bez tego logi potwierdzone na początku kolejnego miesiąca za końcówkę
                // poprzedniego (np. KONTROLA w piątek pokrywająca Pn-Czw, gdy ten piątek przypadł już
                // w nowym miesiącu) były błędnie pomijane, mimo że użytkownik świadomie zapisał je
                // pod tym miesiącem. range/confidence liczymy tylko do celów informacyjnych (tag).
                includeWhole = true;
            } else {
                // Dla sąsiednich miesięcy liczymy TYLKO logi KONTROLA z jednoznacznym zakresem (przejście przez granicę miesiąca)
                if (log.mode !== 'KONTROLA (ZAKRES)' || !range.start) return;
            }

            const overlaps = includeWhole || (range.start && range.end && range.start <= monthEnd && range.end >= monthStart);
            if (!overlaps) return;

            // Log fizycznie leży w innym miesiącu (mk), ale jego wywnioskowany zakres zachodzi na targetMonth —
            // ponieważ nie znamy podziału delty na dni, CAŁA wartość logu liczy się w obu miesiącach.
            // Oznaczamy to osobną flagą, żeby ostrzec przed zsumowaniem dwóch sąsiednich raportów miesięcznych.
            const confidenceTag = (mk !== targetMonth) ? 'cross-month-boundary' : range.confidence;

            log.items.forEach(it => {
                const country = resolveLogCountry(log.type, it.id, offerCountryMap);
                const key = it.id + '|' + country;
                if (!actual[key]) actual[key] = { offerId: it.id, country, value: 0, leadCount: 0, confidence: new Set(), logsInvolved: [] };
                actual[key].value += it.delta * it.price;
                actual[key].leadCount += it.delta;
                actual[key].confidence.add(confidenceTag);
                if (!SCOPE_COUNTRIES.includes((log.type || '').toLowerCase())) actual[key].confidence.add('legacy-account-label');
                actual[key].logsInvolved.push({ invoiceNumber: log.invoiceNumber, timestamp: log.timestamp, delta: it.delta, price: it.price, mode: log.mode, monthKey: mk, rawType: log.type });
            });
        });
    });

    // UWAGA (2026-07-29, poprawka błędu podwójnego liczenia): `log.adjustments[]` na fakturze
    // konsumującej korektę salda NIE JEST doliczane tutaj do wartości. Zweryfikowano na realnych
    // danych: gdy użytkownik klika "przenieś do salda" w index.html, powstają OD RAZU DWA wpisy tej
    // samej kwoty — (1) log "PRZENIESIENIE_DO_SALDA" z pełnym rozbiciem per-lead, zapisany w
    // logach WŁAŚCIWEGO miesiąca (`adj.month`), ORAZ (2) kopia w `adjustments[]` na fakturze, która
    // PÓŹNIEJ faktycznie tę korektę wypłaca (inny, późniejszy miesiąc). Wpis (1) jest już w pełni
    // policzony przez zwykłą pętlę `log.items` powyżej (dla `mk === targetMonth` liczymy WSZYSTKIE
    // logi tego miesiąca, niezależnie od trybu) — doliczanie (2) tutaj było czystym podwójnym
    // liczeniem tej samej kwoty. Potwierdzone identycznymi kwotami/pozycjami po stronie HU/PT/ES
    // dla czerwca 2026 (błąd dawał +1785,50 € ponad realną sumę). Historia AdRice/Sekcja A nie ma
    // tu nic do rzeczy — to był wyłącznie błąd w tej funkcji.

    return actual;
}

function computeShouldBeForMonth(targetMonth) {
    const { start: monthStart, end: monthEnd } = monthBounds(targetMonth);
    const shouldBe = {};
    // Oferty z REALNĄ zmianą ceny w trakcie tego miesiąca (patrz computePriceChangesInMonth) —
    // wielosegmentowe rozbijanie leadów na podstawie zaobserwowanych poziomów cen okazało się
    // zawodne (#2285: automat wyliczył 811€, realnie było 97€, bo pośredni poziom ceny w
    // fakturach nie odpowiadał żadnej realnej, trwałej zmianie payoutu). Nadal WYLICZAMY liczbę
    // (przydatna jako punkt odniesienia do ręcznego sprawdzenia — użytkownik i tak robi własne
    // wyliczenie i chce mieć się z czym porównać), ale tagujemy 'manual-review' i WYKLUCZAMY z
    // sum/tota li w renderReport() — automat może się mylić, więc nie ufamy mu w agregatach.
    const offersNeedingReview = new Set(computePriceChangesInMonth(targetMonth).map(c => c.offerId));

    leadsData.forEach(lead => {
        if (!isConfirmedLead(lead)) return;
        const { date: pricingDate, usedFallback } = getPricingDate(lead);
        if (pricingDate < monthStart || pricingDate > monthEnd) return;
        const key = lead.offerId + '|' + lead.country;
        if (!shouldBe[key]) shouldBe[key] = { offerId: lead.offerId, country: lead.country, value: 0, leadCount: 0, confidence: new Set(), leadsDetail: [] };

        const priceInfo = priceAt(lead.offerId, pricingDate);
        const val = priceInfo ? priceInfo.value : 0;
        shouldBe[key].value += val;
        shouldBe[key].leadCount += 1;

        if (offersNeedingReview.has(lead.offerId)) {
            shouldBe[key].confidence.add('manual-review');
            shouldBe[key].leadsDetail.push({
                pricingDate, creationDate: lead.creationDate, confirmDate: lead.confirmDate, usedFallback,
                price: val, confidence: 'manual-review', account: lead.account
            });
            return;
        }

        let conf = priceInfo ? priceInfo.confidence : 'no-data';
        if (usedFallback) conf += '+confirm-date-missing';
        shouldBe[key].confidence.add(conf);
        shouldBe[key].leadsDetail.push({
            pricingDate, creationDate: lead.creationDate, confirmDate: lead.confirmDate, usedFallback,
            price: val, confidence: priceInfo ? priceInfo.confidence : 'no-data', account: lead.account
        });
    });

    return shouldBe;
}

function computeReconciliation(targetMonth) {
    const shouldBe = computeShouldBeForMonth(targetMonth);
    const actual = computeActualForMonth(targetMonth);
    const keys = new Set([...Object.keys(shouldBe), ...Object.keys(actual)]);
    const rows = [];

    keys.forEach(key => {
        const sb = shouldBe[key] || { value: 0, leadCount: 0, confidence: new Set(['no-lead-data']), leadsDetail: [] };
        const ac = actual[key] || { value: 0, leadCount: 0, confidence: new Set(['not-invoiced']), logsInvolved: [] };
        const [offerId, country] = key.split('|');
        const needsManualReview = sb.confidence.has('manual-review');
        const delta = sb.value - ac.value;
        let flag = 'ZGODNE';
        if (needsManualReview) {
            // Oferta ze zmianą ceny w miesiącu — automatyczna wartość jest POKAZANA (do ręcznego
            // porównania), ale nigdy nie klasyfikowana jako NIEDO/NADFAKTUROWANO — nie ufamy jej
            // na tyle, żeby sugerować konkretną akcję; wyklucza się też z sum w renderReport().
            flag = 'DO_SPRAWDZENIA';
        } else if (Math.abs(delta) > 0.5) {
            // Różnica przy STABILNEJ cenie przez cały miesiąc — jeśli liczba leadów się różni
            // (Administration vs Hub), to zwykłe opóźnienie tygodniowe, które samo się wyrówna w
            // kolejnej fakturze AUTOMAT — użytkownik i tak to robi co tydzień, więc NIE flagujemy
            // tego tutaj jako NIEDO/NADFAKTUROWANO (zostaje ZGODNE). Flagujemy tylko gdy różnica
            // WARTOŚCI utrzymuje się mimo że liczba leadów się zgadza — to nie da się wytłumaczyć
            // zwykłym opóźnieniem ilościowym (rzadki edge case, np. zmiana ceny dokładnie na
            // granicy miesiąca — patrz tag cross-month-boundary).
            const leadCountMismatch = sb.leadCount !== ac.leadCount;
            if (!leadCountMismatch) flag = delta > 0 ? 'NIEDOFAKTUROWANO' : 'NADFAKTUROWANO';
        }

        rows.push({
            offerId, country, shouldBeValue: sb.value, actualValue: ac.value, delta,
            shouldBeLeads: sb.leadCount, actualLeads: ac.leadCount, flag, needsManualReview,
            shouldBeConfidence: [...sb.confidence], actualConfidence: [...ac.confidence],
            leadsDetail: sb.leadsDetail, logsInvolved: ac.logsInvolved
        });
    });

    // Wiersze DO_SPRAWDZENIA zawsze na górze — wymagają uwagi niezależnie od tego, jak duża
    // byłaby ewentualna rozbieżność; reszta sortowana jak dotychczas, malejąco po |delta|.
    rows.sort((a, b) => {
        if (a.flag === 'DO_SPRAWDZENIA' && b.flag !== 'DO_SPRAWDZENIA') return -1;
        if (b.flag === 'DO_SPRAWDZENIA' && a.flag !== 'DO_SPRAWDZENIA') return 1;
        return Math.abs(b.delta || 0) - Math.abs(a.delta || 0);
    });
    return { rows };
}

function runReconciliation() {
    const monthKey = document.getElementById('activeMonth').value;
    if (leadsData.length === 0) {
        alert('Najpierw wgraj eksporty Amsped Administration w Sekcji B (potrzebne są realne daty leadów).');
        return;
    }
    if (getAllInvoicedOfferIds().length === 0) {
        if (!confirm('W bazie Hub-a nie znaleziono żadnych logów faktur — ceny biorą się z realnie zafakturowanych stawek, więc bez logów raport policzy się z ceną 0 dla wszystkich leadów. Kontynuować mimo to?')) return;
    }
    const { rows } = computeReconciliation(monthKey);
    lastReportRows = rows;
    lastReportMonth = monthKey;
    renderReport(rows, monthKey);
}

let currentRenderedRows = [];

function renderReport(rows, monthKey, isFiltered) {
    const container = document.getElementById('reportContainer');
    currentRenderedRows = rows;
    document.getElementById('exportReportBtn').style.display = lastReportRows.length ? 'inline-block' : 'none';

    if (rows.length === 0) {
        container.innerHTML = `<div class="empty-state">${isFiltered ? 'Brak pozycji pasujących do filtra Offer ID.' : 'Brak danych do porównania dla tego miesiąca (ani leadów, ani logów faktur).'}</div>`;
        return;
    }

    // Wiersze DO_SPRAWDZENIA wykluczone z OBU stron sumy (nie tylko Powinno Być) — inaczej
    // "Różnica netto" myląco mieszałaby zaufaną resztę raportu z Zafakturowano tych ofert bez
    // odpowiadającego im Powinno Być, dając fałszywie ogromną, niewytłumaczalną różnicę.
    const trustedRows = rows.filter(r => r.flag !== 'DO_SPRAWDZENIA');
    const totalShouldBe = trustedRows.reduce((s, r) => s + r.shouldBeValue, 0);
    const totalActual = trustedRows.reduce((s, r) => s + r.actualValue, 0);
    const totalDelta = totalShouldBe - (totalActual);
    const under = rows.filter(r => r.flag === 'NIEDOFAKTUROWANO');
    const over = rows.filter(r => r.flag === 'NADFAKTUROWANO');
    const manualReviewRows = rows.filter(r => r.flag === 'DO_SPRAWDZENIA');

    const noDataCount = rows.filter(r => r.shouldBeConfidence.some(c => c.startsWith('no-data'))).length;
    const assumedCount = rows.filter(r => r.shouldBeConfidence.some(c => c.startsWith('assumed'))).length;
    const approxBoundaryCount = rows.filter(r => r.shouldBeConfidence.some(c => c.startsWith('approx'))).length;
    const offCadenceCount = rows.filter(r => r.actualConfidence.some(c => c === 'off-cadence' || c === 'off-cadence-approx')).length;
    const notInvoicedCount = rows.filter(r => r.actualConfidence.includes('not-invoiced')).length;
    const boundaryCount = rows.filter(r => r.actualConfidence.includes('cross-month-boundary')).length;

    let banner = '';
    if (noDataCount || assumedCount || approxBoundaryCount || offCadenceCount || notInvoicedCount || boundaryCount || manualReviewRows.length) {
        banner = `<div class="confidence-banner">⚠️ <b>Uwagi dla ${monthKey}:</b><br>`;
        if (manualReviewRows.length) banner += `• ${manualReviewRows.length} ofert ma zmianę ceny w trakcie miesiąca — wykluczone z sum, korekta w panelu "⚡ Oferty ze zmianą ceny" powyżej.<br>`;
        if (noDataCount) banner += `• ${noDataCount} pozycji bez żadnej zafakturowanej ceny w logach (użyto 0 €).<br>`;
        if (assumedCount) banner += `• ${assumedCount} pozycji sprzed pierwszej znanej faktury tej oferty — użyto najwcześniej znanej ceny.<br>`;
        if (approxBoundaryCount) banner += `• ${approxBoundaryCount} pozycji z przybliżoną datą granicy zmiany ceny (brak dokładnej daty w Sekcji A).<br>`;
        if (offCadenceCount) banner += `• ${offCadenceCount} pozycji poza standardowym cyklem pon./pt. — okres przybliżony.<br>`;
        if (notInvoicedCount) banner += `• ${notInvoicedCount} pozycji bez żadnego logu faktury w tym miesiącu.<br>`;
        if (boundaryCount) banner += `• ${boundaryCount} pozycji na granicy miesięcy liczy się w OBU raportach — nie sumuj dwóch sąsiednich miesięcy razem.<br>`;
        banner += `</div>`;
    }

    let html = banner + `
    <div class="stat-row">
        <div class="stat-box"><div class="stat-label">Powinno Być (razem)</div><div class="stat-value">${totalShouldBe.toFixed(2)} €</div></div>
        <div class="stat-box"><div class="stat-label">Faktycznie Zafakturowano (razem)</div><div class="stat-value">${totalActual.toFixed(2)} €</div></div>
        <div class="stat-box"><div class="stat-label">Różnica netto</div><div class="stat-value" style="color:${Math.abs(totalDelta) < 0.5 ? '#34d399' : (totalDelta > 0 ? '#fbbf24' : '#f87171')}">${totalDelta > 0 ? '+' : ''}${totalDelta.toFixed(2)} €</div></div>
        <div class="stat-box"><div class="stat-label">Niedofakturowano / Nadfakturowano</div><div class="stat-value" style="font-size:1.1rem;"><span style="color:#fbbf24">${under.length}</span> / <span style="color:#f87171">${over.length}</span> pozycji</div></div>
    </div>
    <table class="data-table"><thead><tr>
        <th>Offer ID</th><th>Kraj</th><th style="text-align:right">Powinno Być</th><th style="text-align:right">Zafakturowano</th>
        <th style="text-align:right">Delta</th><th>Leady (P/A)</th><th>Flaga</th><th>Pewność</th>
    </tr></thead><tbody>`;

    rows.forEach((r, idx) => {
        const isManualReview = r.flag === 'DO_SPRAWDZENIA';
        const flagCls = isManualReview ? 'tag-info' : (r.flag === 'ZGODNE' ? 'tag-ok' : (r.flag === 'NIEDOFAKTUROWANO' ? 'tag-warn' : 'tag-danger'));
        // Dla DO_SPRAWDZENIA POKAZUJEMY wyliczoną wartość (punkt odniesienia do ręcznego
        // porównania), ale wyszarzoną i z gwiazdką — nie wliczona do sum, automat mógł się mylić.
        const shouldBeCell = `${r.shouldBeValue.toFixed(2)} €${isManualReview ? ' *' : ''}`;
        const deltaCell = `${r.delta > 0 ? '+' : ''}${r.delta.toFixed(2)} €${isManualReview ? ' *' : ''}`;
        const deltaColor = isManualReview ? 'var(--text-muted)' : (Math.abs(r.delta) < 0.5 ? '#34d399' : (r.delta > 0 ? '#fbbf24' : '#f87171'));
        const shouldBeStyle = isManualReview ? 'color:var(--text-muted); font-style:italic;' : '';
        html += `<tr onclick="openDrilldown(${idx})">
            <td>#${r.offerId}</td><td>${r.country.toUpperCase()}</td>
            <td style="text-align:right; ${shouldBeStyle}" title="${isManualReview ? 'Automatyczne wyliczenie, niepewne — sprawdź ręcznie i porównaj (nie wliczone do sum powyżej)' : ''}">${shouldBeCell}</td>
            <td style="text-align:right">${r.actualValue.toFixed(2)} €</td>
            <td style="text-align:right; font-weight:700; color:${deltaColor}; ${isManualReview ? 'font-style:italic;' : ''}" title="${isManualReview ? 'Automatyczne wyliczenie, niepewne — sprawdź ręcznie i porównaj (nie wliczone do sum powyżej)' : ''}">${deltaCell}</td>
            <td>${r.shouldBeLeads} / ${r.actualLeads}</td>
            <td><span class="tag ${flagCls}">${r.flag}</span></td>
            <td>${[...new Set([...r.shouldBeConfidence, ...r.actualConfidence])].map(confidenceTag).join(' ')}</td>
        </tr>`;
    });
    html += `</tbody></table>`;
    if (manualReviewRows.length) html += `<div style="font-size:0.7rem; color:var(--text-muted); margin-top:0.5rem;">* = wyliczenie automatu, niepewne, nie wliczone do sum. Korekta w panelu "Oferty ze zmianą ceny".</div>`;

    html += renderCountrySummary();

    container.innerHTML = html;
}

// Podsumowanie do dopłaty/rabatu per kraj, zawsze liczone z PEŁNEGO (nieprzefiltrowanego) raportu —
// żeby filtr po Offer ID w tabeli powyżej go nie zniekształcał. Świadomie NIE miesza się tu starych,
// ręcznych korekt (pendingAdjustments) — to osobny, ręczny mechanizm sprzed tego narzędzia i jego
// wliczanie tylko wprowadzało zamieszanie. Liczba tutaj to czysta suma rozbieżności (Powinno Być −
// Zafakturowano) ze wszystkich ofert danego kraju — dokładnie tyle trzeba dopisać/zrabatować.
function renderCountrySummary() {
    if (lastReportRows.length === 0) return '';

    // Wyklucza wiersze DO_SPRAWDZENIA — ich delta to niepewne wyliczenie automatu, nie coś, co
    // powinno trafić do sumy "ile dopisać/zrabatować" bez ręcznej weryfikacji (patrz panel "Oferty
    // ze zmianą ceny", tam trafiają Twoje ręcznie zweryfikowane korekty osobno).
    const byCountry = {};
    lastReportRows.filter(r => r.flag !== 'DO_SPRAWDZENIA').forEach(r => {
        byCountry[r.country] = (byCountry[r.country] || 0) + r.delta;
    });

    const countries = Object.keys(byCountry).filter(c => Math.abs(byCountry[c]) > 0.01);
    if (countries.length === 0) return '';

    countries.sort((a, b) => Math.abs(byCountry[b]) - Math.abs(byCountry[a]));

    let html = `<h3>📮 Podsumowanie do doliczenia / zrabatowania — per kraj (${lastReportMonth})</h3>
    <div style="font-size:0.75rem; color:var(--text-muted); margin-bottom:0.75rem;">Bez ofert DO_SPRAWDZENIA (te rozliczasz osobno w panelu "Oferty ze zmianą ceny"). Dodatnia = dopłata, ujemna = rabat na kolejnej fakturze.</div>
    <table class="data-table"><thead><tr><th>Kraj</th><th style="text-align:right">Do dopłaty / rabatu</th></tr></thead><tbody>`;

    let grandTotal = 0;
    countries.forEach(c => {
        const val = byCountry[c];
        grandTotal += val;
        const color = val > 0 ? '#fbbf24' : '#f87171';
        html += `<tr>
            <td>${c.toUpperCase()}</td>
            <td style="text-align:right; font-weight:800; color:${color}">${val > 0 ? '+' : ''}${val.toFixed(2)} €</td>
        </tr>`;
    });
    html += `<tr style="background:rgba(16,185,129,0.08); font-weight:800;">
        <td style="text-align:right; color:var(--accent)">SUMA WSZYSTKICH KRAJÓW:</td>
        <td style="text-align:right; color:#fbbf24;">${grandTotal > 0 ? '+' : ''}${grandTotal.toFixed(2)} €</td>
    </tr>`;
    html += `</tbody></table>`;
    return html;
}

function openDrilldown(idx) {
    const r = currentRenderedRows[idx];
    if (!r) return;

    const isManualReview = r.flag === 'DO_SPRAWDZENIA';

    let html = `<h2 style="color:var(--accent); margin-top:0;">Offer #${r.offerId} — ${r.country.toUpperCase()}</h2>
    <div class="stat-row">
        <div class="stat-box"><div class="stat-label">Powinno Być${isManualReview ? ' (automat, niepewne)' : ''}</div><div class="stat-value"${isManualReview ? ' style="color:var(--text-muted);"' : ''}>${r.shouldBeValue.toFixed(2)} €</div></div>
        <div class="stat-box"><div class="stat-label">Zafakturowano</div><div class="stat-value">${r.actualValue.toFixed(2)} €</div></div>
        <div class="stat-box"><div class="stat-label">Delta${isManualReview ? ' (automat, niepewne)' : ''}</div><div class="stat-value" style="color:${isManualReview ? 'var(--text-muted)' : (Math.abs(r.delta) < 0.5 ? '#34d399' : (r.delta > 0 ? '#fbbf24' : '#f87171'))}">${r.delta > 0 ? '+' : ''}${r.delta.toFixed(2)} €</div></div>
    </div>`;

    if (isManualReview) {
        html += `<div class="confidence-banner">⚠️ Zmiana ceny w trakcie miesiąca — wyliczenie automatu, tylko punkt odniesienia. Wpisz korektę w panelu "⚡ Oferty ze zmianą ceny" w Sekcji C.</div>`;
    } else if (r.flag !== 'ZGODNE') {
        const action = r.delta > 0
            ? `Sugerowana dopłata: <b>${r.delta.toFixed(2)} €</b>.`
            : `Sugerowany rabat: <b>${Math.abs(r.delta).toFixed(2)} €</b>.`;
        html += `<div class="confidence-banner" style="border-color: var(--accent); color: var(--accent-hover);">💡 ${action}</div>`;
    }

    html += `<h3>Leady uwzględnione w "Powinno Być" (${r.leadsDetail.length})</h3>`;
    if (r.leadsDetail.length === 0) {
        html += `<div class="empty-state">Brak leadów z Sekcji B dla tej pozycji w wybranym miesiącu.</div>`;
    } else {
        html += `<table class="data-table"><thead><tr><th>creation_date</th><th>confirm_date</th><th>Użyta data (${getPricingDateMode()})</th><th>Konto</th><th style="text-align:right">Zastosowana cena</th><th>Pewność</th></tr></thead><tbody>`;
        r.leadsDetail.slice().sort((a, b) => a.pricingDate - b.pricingDate).slice(0, 500).forEach(l => {
            html += `<tr><td>${fmtDate(l.creationDate)}</td><td>${l.confirmDate ? fmtDate(l.confirmDate) : '<span style="color:var(--text-muted)">brak</span>'}</td><td style="font-weight:700">${fmtDate(l.pricingDate)}${l.usedFallback ? ' <span class="tag tag-warn">fallback</span>' : ''}</td><td>${l.account}</td><td style="text-align:right">${l.price.toFixed(2)} €</td><td>${confidenceTag(l.confidence)}</td></tr>`;
        });
        html += `</tbody></table>`;
        if (r.leadsDetail.length > 500) html += `<div style="font-size:0.7rem; color:var(--text-muted); margin-top:0.4rem;">Pokazano 500 z ${r.leadsDetail.length} leadów.</div>`;
    }

    html += `<h3>Logi faktur uwzględnione w "Zafakturowano" (${r.logsInvolved.length})</h3>`;
    if (r.logsInvolved.length === 0) {
        html += `<div class="empty-state">Nie znaleziono żadnego logu faktury dla tej pozycji w tym miesiącu (ani w sąsiednich, sprawdzonych pod kątem granicy miesiąca).</div>`;
    } else {
        html += `<table class="data-table"><thead><tr><th>Faktura</th><th>Timestamp</th><th>Tryb</th><th style="text-align:right">Delta</th><th style="text-align:right">Cena</th></tr></thead><tbody>`;
        r.logsInvolved.forEach(l => {
            html += `<tr><td>${l.invoiceNumber || '---'}</td><td>${l.timestamp}</td><td>${l.mode}</td><td style="text-align:right">${l.delta}</td><td style="text-align:right">${(typeof l.price === 'number' ? l.price.toFixed(2) : l.price)} €</td></tr>`;
        });
        html += `</tbody></table>`;
    }

    document.getElementById('modalContent').innerHTML = html;
    document.getElementById('detailsModal').style.display = 'flex';
}

function exportReportCsv() {
    if (!lastReportRows.length) return;
    let csv = 'Offer_ID;Country;ShouldBe;Actual;Delta;Leads_ShouldBe;Leads_Actual;Flag;Confidence\n';
    lastReportRows.forEach(r => {
        const conf = [...new Set([...r.shouldBeConfidence, ...r.actualConfidence])].join('|');
        // Flaga DO_SPRAWDZENIA w kolumnie Flag już oznacza "automat, niepewne" — ShouldBe/Delta
        // eksportowane normalnie, żeby dało się je porównać w Excelu z ręcznym przeliczeniem.
        csv += `${r.offerId};${r.country.toUpperCase()};${r.shouldBeValue.toFixed(2)};${r.actualValue.toFixed(2)};${r.delta.toFixed(2)};${r.shouldBeLeads};${r.actualLeads};${r.flag};${conf}\n`;
    });
    downloadFile(`rekoncyliacja_${lastReportMonth}.csv`, csv, 'text/csv;charset=utf-8');
    showNotif('⬇️ Raport wyeksportowany do CSV.');
}
